components:
  schemas:
    AcademicSession:
      type: object
      description: Serializer for AcademicSession.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Session name (e.g. 2026)
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicSessionStatusEnum'
          readOnly: true
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - institution
      - is_current
      - name
      - start_date
      - status
      - terms
      - updated_at
    AcademicSessionRequest:
      type: object
      description: Serializer for AcademicSession.
      properties:
        name:
          type: string
          minLength: 1
          description: Session name (e.g. 2026)
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
    AcademicSessionStatusEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
    ActionEnum:
      enum:
      - promote
      - repeat
      - demote
      - withdraw
      type: string
      description: |-
        * `promote` - Promote to Next Class
        * `repeat` - Repeat Current Class
        * `demote` - Demote
        * `withdraw` - Withdraw
    AdmissionCircular:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
        session_name:
          type: string
          readOnly: true
        class_level:
          type: string
          format: uuid
        class_level_name:
          type: string
          readOnly: true
        title:
          type: string
          description: e.g. Admission Circular 2026 - Class 6
          maxLength: 255
        seats_available:
          type: integer
          maximum: 2147483647
          minimum: 0
        application_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Fee required to confirm application submission
        form_open_date:
          type: string
          format: date
        form_close_date:
          type: string
          format: date
        instructions:
          type: string
        eligibility_criteria:
          description: 'e.g. {''min_age_years'': 10, ''max_age_years'': 12, ''min_gpa'':
            3.50}'
        status:
          $ref: '#/components/schemas/AdmissionCircularStatusEnum'
        applications_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applications_count
      - class_level
      - class_level_name
      - created_at
      - form_close_date
      - form_open_date
      - id
      - session
      - session_name
      - title
      - updated_at
    AdmissionCircularPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session_name:
          type: string
          readOnly: true
        class_level_name:
          type: string
          readOnly: true
        title:
          type: string
          description: e.g. Admission Circular 2026 - Class 6
          maxLength: 255
        seats_available:
          type: integer
          maximum: 2147483647
          minimum: 0
        application_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Fee required to confirm application submission
        form_open_date:
          type: string
          format: date
        form_close_date:
          type: string
          format: date
        instructions:
          type: string
        eligibility_criteria:
          description: 'e.g. {''min_age_years'': 10, ''max_age_years'': 12, ''min_gpa'':
            3.50}'
      required:
      - class_level_name
      - form_close_date
      - form_open_date
      - id
      - session_name
      - title
    AdmissionCircularRequest:
      type: object
      properties:
        session:
          type: string
          format: uuid
        class_level:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          description: e.g. Admission Circular 2026 - Class 6
          maxLength: 255
        seats_available:
          type: integer
          maximum: 2147483647
          minimum: 0
        application_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Fee required to confirm application submission
        form_open_date:
          type: string
          format: date
        form_close_date:
          type: string
          format: date
        instructions:
          type: string
        eligibility_criteria:
          description: 'e.g. {''min_age_years'': 10, ''max_age_years'': 12, ''min_gpa'':
