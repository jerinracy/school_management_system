openapi: 3.0.3
info:
  title: School Management System API (Bangladesh)
  version: 1.0.0
  description: Production-grade Multi-Tenant School Management API for Bangladeshi
    Institutions. Supports Biometric Attendance, Admission, GPA 5.0 Examination, and
    Multi-Gateway Fees.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate using username or BD mobile number with password.
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Login successful, tokens returned.
        '401':
          description: Invalid credentials.
        '429':
          description: Account locked due to consecutive failed attempts.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout current session and invalidate refresh token.
      summary: Logout
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Successfully logged out.
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Revoke all active sessions for current user.
      summary: Logout All Sessions
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: All sessions revoked.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve and update current user's profile and permissions.
      summary: Get Current Profile
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Retrieve and update current user's profile and permissions.
      summary: Update Profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: Request a one-time password delivered via SMS.
      summary: Request Phone OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: OTP sent successfully.
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Verify phone OTP and obtain JWT tokens.
      summary: Verify Phone OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Verification successful.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change authenticated user's password.
      summary: Change Password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully.
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/roles/:
    get:
      operationId: auth_roles_list
      description: CRUD for institutional roles.
      summary: List Roles
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Role Management
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'
          description: ''
    post:
