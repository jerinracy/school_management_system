openapi: 3.0.3
info:
  title: School Management System API (Bangladesh)
  version: 1.0.0
  description: Production-grade Multi-Tenant School Management API for Bangladeshi
    Institutions. Supports Biometric Attendance, Admission, GPA 5.0 Examination, and
    Multi-Gateway Fees.
paths:
  /api/v1/academics/class-subjects/:
    get:
      operationId: academics_class_subjects_list
      description: |-
        Mixin for DRF ViewSets ensuring strict tenant data isolation.

        1. Filters get_queryset() to only return objects belonging to the current user's institution.
        2. Automatically assigns request.user.institution on perform_create().
      summary: List class subject offerings
      parameters:
      - in: query
        name: class_level
        schema:
          type: string
          format: uuid
      - in: query
        name: group
        schema:
          type: string
          format: uuid
      - in: query
        name: is_optional_elective
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: session
        schema:
          type: string
          format: uuid
      tags:
      - Academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassSubjectList'
          description: ''
    post:
      operationId: academics_class_subjects_create
      description: |-
        Mixin for DRF ViewSets ensuring strict tenant data isolation.

        1. Filters get_queryset() to only return objects belonging to the current user's institution.
        2. Automatically assigns request.user.institution on perform_create().
      summary: Assign subject to class and session
      tags:
      - Academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassSubjectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSubject'
          description: ''
