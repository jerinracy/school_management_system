          description: e.g. Written Admission Test - Class 6
          maxLength: 128
        test_date:
          type: string
          format: date-time
        venue:
          type: string
          minLength: 1
          description: e.g. Main Campus Building 1
          maxLength: 255
        total_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        pass_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        instructions:
          type: string
