        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/auth/roles/{id}/:
    get:
      operationId: auth_roles_retrieve
      description: CRUD for institutional roles.
      summary: Get Role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Role.
        required: true
      tags:
      - Role Management
      security:
