    get:
      operationId: health_retrieve
      description: Verifies database and Redis cache connectivity.
      summary: System Health Check
      tags:
      - System
      responses:
        '200':
          description: All backend systems are operational.
        '503':
          description: One or more dependent systems are degraded.
