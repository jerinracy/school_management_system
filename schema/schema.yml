  /api/v1/institutions/holidays/:
    get:
      operationId: institutions_holidays_list
      description: CRUD viewset for institution holidays.
      summary: List Holidays
      parameters:
      - in: query
        name: applies_to_all_branches
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - emergency
          - govt
          - institutional
        description: |-
          * `govt` - Government Public Holiday
          * `institutional` - Institutional Holiday
          * `emergency` - Emergency Closure
      tags:
      - Holidays
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHolidayList'
