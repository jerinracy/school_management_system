components:
  schemas:
    AcademicSession:
      type: object
      description: Serializer for AcademicSession.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Session name (e.g. 2026)
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - institution
      - is_current
      - name
      - start_date
      - status
      - terms
      - updated_at
    AcademicSessionRequest:
      type: object
      description: Serializer for AcademicSession.
      properties:
        name:
          type: string
          minLength: 1
          description: Session name (e.g. 2026)
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
    BoardEnum:
      enum:
      - dhaka
      - rajshahi
      - chittagong
      - comilla
      - jessore
      - barisal
      - sylhet
      - dinajpur
      - mymensingh
      - madrasah
      - technical
      - cambridge
      - edexcel
      - ib
      type: string
      description: |-
        * `dhaka` - Dhaka
        * `rajshahi` - Rajshahi
        * `chittagong` - Chittagong
        * `comilla` - Comilla
        * `jessore` - Jessore
        * `barisal` - Barisal
        * `sylhet` - Sylhet
        * `dinajpur` - Dinajpur
        * `mymensingh` - Mymensingh
        * `madrasah` - Madrasah
        * `technical` - Technical
        * `cambridge` - Cambridge
        * `edexcel` - Edexcel
        * `ib` - International Baccalaureate
    Branch:
      type: object
      description: Serializer for Branch.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          description: Short unique branch code (e.g. MAIN, DHAN)
          maxLength: 50
        address:
          type: string
        is_main:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - institution
      - name
      - updated_at
    BranchRequest:
      type: object
      description: Serializer for Branch.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          description: Short unique branch code (e.g. MAIN, DHAN)
          maxLength: 50
        address:
          type: string
        is_main:
          type: boolean
      required:
      - code
      - name
    Holiday:
      type: object
      description: Serializer for Holiday.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/HolidayTypeEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        applies_to_all_branches:
          type: boolean
        branches:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - institution
      - name
      - start_date
      - updated_at
    HolidayRequest:
      type: object
      description: Serializer for Holiday.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/HolidayTypeEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        applies_to_all_branches:
          type: boolean
        branches:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
      required:
      - end_date
      - name
      - start_date
    HolidayTypeEnum:
      enum:
      - govt
      - institutional
      - emergency
      type: string
      description: |-
        * `govt` - Government Public Holiday
        * `institutional` - Institutional Holiday
        * `emergency` - Emergency Closure
    Institution:
      type: object
      description: Serializer for Institution profile read and update.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_bn:
          type: string
          title: Name (Bangla)
          maxLength: 255
        name_en:
          type: string
          title: Name (English)
          maxLength: 255
        eiin:
          type: string
          nullable: true
          description: Educational Institute Identification Number (e.g. 134567)
          maxLength: 20
        mpo_status:
          $ref: '#/components/schemas/MpoStatusEnum'
        board:
          allOf:
          - $ref: '#/components/schemas/BoardEnum'
          title: Education Board
        type:
          allOf:
