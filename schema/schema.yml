          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Fee required to confirm application submission
        form_open_date:
          type: string
          format: date
        form_close_date:
          type: string
          format: date
        instructions:
          type: string
        eligibility_criteria:
          description: 'e.g. {''min_age_years'': 10, ''max_age_years'': 12, ''min_gpa'':
            3.50}'
        status:
          $ref: '#/components/schemas/AdmissionCircularStatusEnum'
    PatchedAdmissionTestRequest:
      type: object
      properties:
        circular:
