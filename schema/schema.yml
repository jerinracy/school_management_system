      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/auth/sessions/{id}/revoke/:
    post:
      operationId: auth_sessions_revoke_create
      description: View and revoke current user sessions.
      summary: Revoke Session
      parameters:
