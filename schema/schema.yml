          description: ''
    patch:
      operationId: auth_roles_partial_update
      description: CRUD for institutional roles.
      summary: Partial Update Role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Role.
        required: true
      tags:
      - Role Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    delete:
      operationId: auth_roles_destroy
      description: CRUD for institutional roles.
      summary: Delete Role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Role.
        required: true
      tags:
      - Role Management
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: View and revoke current user sessions.
