{% load django_vite %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System — Dashboard</title>
    {% if debug %}
        {% vite_react_refresh %}
        {% vite_hmr_client %}
    {% endif %}
    {% vite_asset 'src/main.tsx' %}
</head>
<body class="bg-[#F8F9FA] text-[#111827] font-sans antialiased">
    <div id="root">
        <noscript>
            <div style="padding: 2rem; text-align: center;">
                <h2>JavaScript Required</h2>
                <p>Please enable JavaScript to access the School Management System Dashboard.</p>
            </div>
        </noscript>
    </div>
</body>
</html>
